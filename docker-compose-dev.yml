  #     - ./sns-web/next.config.ts:/app/next.config.ts
  #     - ./sns-web/tsconfig.json:/app/tsconfig.json
  #     - ./sns-web/tailwind.config.ts:/app/tailwind.config.ts
  #     - ./sns-web/postcss.config.mjs:/app/postcss.config.mjs
  #     - ./sns-web/components.json:/app/components.json
  #     # Preserve node_modules (anonymous volume)
