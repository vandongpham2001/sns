name: sns-dev

services:
  api-gateway:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.dev.api-gateway
    container_name: sns.api-gateway.dev
    ports:
      - "${API_GATEWAY_PORT}:8888"
    volumes:
      # Hot reload: mount source code
      - ./api-gateway/src:/app/src:cached
      - ./api-gateway/build.gradle:/app/build.gradle
      - ./api-gateway/settings.gradle:/app/settings.gradle
      - ./api-gateway/gradle.properties:/app/gradle.properties
      - ./api-gateway/lombok.config:/app/lombok.config
      - ./api-gateway/logs:/app/logs
      # Gradle cache for faster builds
      - gradle-cache-api-gateway:/home/gradle/.gradle
    env_file:
    - .env.gateway
    environment:
      SPRING_PROFILES_ACTIVE: dev
#      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
#      SPRING_DEVTOOLS_RESTART_POLL_INTERVAL: 1s
    depends_on:
      - identity-service
    networks:
      - sns-network
    restart: unless-stopped

  identity-service:
    build: 
      context: .
      dockerfile: ./docker/Dockerfile.dev.identity-service
    container_name: sns.identity-service.dev
    ports:
      - "${IDENTITY_SERVICE_PORT}:8080"
    volumes:
      # Hot reload: mount source code
      - ./identity-service/src:/app/src:cached
      - ./identity-service/build.gradle:/app/build.gradle
      - ./identity-service/settings.gradle:/app/settings.gradle
      - ./identity-service/gradle.properties:/app/gradle.properties
      - ./identity-service/lombok.config:/app/lombok.config
      - ./identity-service/logs:/app/logs
      # Gradle cache for faster builds
      - gradle-cache-identity-service:/home/gradle/.gradle
    env_file:
    - .env.identity
    environment:
      SPRING_PROFILES_ACTIVE: dev
#      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
#      SPRING_DEVTOOLS_RESTART_POLL_INTERVAL: 1s
    depends_on:
      - postgres
    networks:
      - sns-network
    restart: unless-stopped

  profile-service:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.dev.profile-service
    container_name: sns.profile-service.dev
    ports:
      - "${PROFILE_SERVICE_PORT}:8081"
    volumes:
      # Hot reload: mount source code
      - ./profile-service/src:/app/src:cached
      - ./profile-service/build.gradle:/app/build.gradle
      - ./profile-service/settings.gradle:/app/settings.gradle
      - ./profile-service/gradle.properties:/app/gradle.properties
      - ./profile-service/lombok.config:/app/lombok.config
      - ./profile-service/logs:/app/logs
      # Gradle cache for faster builds
      - gradle-cache-profile-service:/home/gradle/.gradle
    env_file:
    - .env.profile
    environment:
      SPRING_PROFILES_ACTIVE: dev
#      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
#      SPRING_DEVTOOLS_RESTART_POLL_INTERVAL: 1s
    depends_on:
      - neo4j
    networks:
      - sns-network
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.dev.notification-service
    container_name: sns.notification-service.dev
    ports:
      - "${NOTIFICATION_SERVICE_PORT}:8082"
    volumes:
      # Hot reload: mount source code
      - ./notification-service/src:/app/src:cached
      - ./notification-service/build.gradle:/app/build.gradle
      - ./notification-service/settings.gradle:/app/settings.gradle
      - ./notification-service/gradle.properties:/app/gradle.properties
      - ./notification-service/lombok.config:/app/lombok.config
      - ./notification-service/logs:/app/logs
      # Gradle cache for faster builds
      - gradle-cache-notification-service:/home/gradle/.gradle
    env_file:
    - .env.notification
    environment:
      SPRING_PROFILES_ACTIVE: dev
#      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
#      SPRING_DEVTOOLS_RESTART_POLL_INTERVAL: 1s
    depends_on:
      - mongodb
      - kafka
    networks:
      - sns-network
    restart: unless-stopped

  post-service:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.dev.post-service
    container_name: sns.post-service.dev
    ports:
      - "${POST_SERVICE_PORT}:8083"
    volumes:
      # Hot reload: mount source code
      - ./post-service/src:/app/src:cached
      - ./post-service/build.gradle:/app/build.gradle
      - ./post-service/settings.gradle:/app/settings.gradle
      - ./post-service/gradle.properties:/app/gradle.properties
      - ./post-service/lombok.config:/app/lombok.config
      - ./post-service/logs:/app/logs
      # Gradle cache for faster builds
      - gradle-cache-post-service:/home/gradle/.gradle
    env_file:
    - .env.post
    environment:
      SPRING_PROFILES_ACTIVE: dev
#      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
#      SPRING_DEVTOOLS_RESTART_POLL_INTERVAL: 1s
    depends_on:
      - mongodb
    networks:
      - sns-network
    restart: unless-stopped

  file-service:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.dev.file-service
    container_name: sns.file-service.dev
    ports:
      - "${FILE_SERVICE_PORT}:8084"
    volumes:
      # Hot reload: mount source code
      - ./file-service/src:/app/src:cached
      - ./file-service/build.gradle:/app/build.gradle
      - ./file-service/settings.gradle:/app/settings.gradle
      - ./file-service/gradle.properties:/app/gradle.properties
      - ./file-service/lombok.config:/app/lombok.config
      - ./file-service/logs:/app/logs
      # Gradle cache for faster builds
      - gradle-cache-file-service:/home/gradle/.gradle
    env_file:
    - .env.file
    environment:
      SPRING_PROFILES_ACTIVE: dev
#      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
#      SPRING_DEVTOOLS_RESTART_POLL_INTERVAL: 1s
    depends_on:
      - mongodb
    networks:
      - sns-network
    restart: unless-stopped

  chat-service:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.dev.chat-service
    container_name: sns.chat-service.dev
    ports:
      - "${CHAT_SERVICE_PORT}:8085"
    volumes:
      # Hot reload: mount source code
      - ./chat-service/src:/app/src:cached
      - ./chat-service/build.gradle:/app/build.gradle
      - ./chat-service/settings.gradle:/app/settings.gradle
      - ./chat-service/gradle.properties:/app/gradle.properties
      - ./chat-service/lombok.config:/app/lombok.config
      - ./chat-service/logs:/app/logs
      # Gradle cache for faster builds
      - gradle-cache-chat-service:/home/gradle/.gradle
    env_file:
    - .env.chat
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # SPRING_DEVTOOLS_RESTART_ENABLED: "true"
      # SPRING_DEVTOOLS_RESTART_POLL_INTERVAL: 1s
    depends_on:
      - mongodb
    networks:
      - sns-network
    restart: unless-stopped

  search-service:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.dev.search-service
    container_name: sns.search-service.dev
    ports:
      - "${SEARCH_SERVICE_PORT}:8086"
    volumes:
      # Hot reload: mount source code
      - ./search-service/src:/app/src:cached
      - ./search-service/build.gradle:/app/build.gradle
      - ./search-service/settings.gradle:/app/settings.gradle
      - ./search-service/gradle.properties:/app/gradle.properties
      - ./search-service/lombok.config:/app/lombok.config
      - ./search-service/logs:/app/logs
      # Gradle cache for faster builds
      - gradle-cache-search-service:/home/gradle/.gradle
    env_file:
    - .env.search
    environment:
      SPRING_PROFILES_ACTIVE: dev
#      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
#      SPRING_DEVTOOLS_RESTART_POLL_INTERVAL: 1s
    networks:
      - sns-network
    restart: unless-stopped

  # sns-web:
  #   build:
  #     context: .
  #     dockerfile: ./docker/Dockerfile.dev.sns-web
  #   container_name: sns.web.dev
  #   ports:
