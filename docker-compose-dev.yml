  #   environment:
  #     NODE_ENV: development
  #     WATCHPACK_POLLING: "true"
  #   networks:
  #     - sns-network
  #   restart: unless-stopped

  postgres:
    image: postgres:18.0-alpine
    container_name: sns.postgres.dev
    hostname: postgres
    ports:
      - "${POSTGRES_DB_PORT}:5432"
    volumes:
      - ./data-dev/postgres_data:/var/lib/postgresql
    env_file:
    - .env.postgres
    networks:
      - sns-network
    restart: unless-stopped
  
  mongodb:
    image: bitnami/mongodb:latest
    container_name: sns.mongodb.dev
    hostname: mongodb
    ports:
      - "${MONGO_DB_PORT}:27017"
    volumes:
      - ./data-dev/mongodb_data:/bitnami/mongodb
      - ./init/mongodb:/docker-entrypoint-initdb.d
    env_file:
    - .env.mongo
    networks:
      - sns-network
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26.18
    container_name: sns.neo4j.dev
    hostname: neo4j
    ports:
      - "${NEO4J_DB_HTTP_PORT}:7474"
      - "${NEO4J_DB_BOLT_PORT}:7687"
    volumes:
      - ./data-dev/neo4j_data:/data
      - ./data-dev/neo4j_logs:/logs
      - ./data-dev/neo4j_plugins:/plugins
    env_file:
    - .env.neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_DB_USERNAME}/${NEO4J_DB_PASSWORD}
    networks:
      - sns-network
    restart: unless-stopped
  
  kafka:
    image: 'apache/kafka:4.1.1'
    container_name: sns.kafka.dev
    hostname: kafka
    ports:
      - "${KAFKA_CLIENT_PORT}:9092"
      - "${KAFKA_CONTROLLER_PORT}:9093"
      - "${KAFKA_INTER_BROKER_PORT}:9094"
    env_file:
    - .env.kafka
    networks:
      - sns-network
    restart: unless-stopped

networks:
  sns-network:
    driver: bridge
    name: sns-network

volumes:
  # Gradle cache volumes for each service (faster rebuilds)
  gradle-cache-api-gateway:
  gradle-cache-identity-service:
  gradle-cache-profile-service:
  gradle-cache-notification-service:
  gradle-cache-post-service:
  gradle-cache-file-service:
  gradle-cache-chat-service:
  gradle-cache-search-service:

