version: '3.8'
name: sns

services:
  api-gateway:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.api-gateway
    container_name: sns.api-gateway
    ports:
      - "8888:8888"
    depends_on:
      - identity-service
    networks:
      - sns-network
    restart: unless-stopped

  identity-service:
    build: 
      context: .
      dockerfile: ./docker/Dockerfile.identity-service
    container_name: sns.identity-service
    expose:
      - "8080"
    volumes:
      - ./identity-service/logs:/app/logs
    environment:
      POSTGRES_DB_HOST: ${POSTGRES_DB_HOST}
      POSTGRES_DB_PORT: ${POSTGRES_DB_PORT}
      POSTGRES_DB_NAME: ${POSTGRES_DB_NAME}
      POSTGRES_DB_USERNAME: ${POSTGRES_DB_USERNAME}
      POSTGRES_DB_PASSWORD: ${POSTGRES_DB_PASSWORD}
    depends_on:
      - postgres
    networks:
      - sns-network
    restart: unless-stopped

  profile-service:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.profile-service
    container_name: sns.profile-service
    expose:
      - "8081"
    volumes:
      - ./profile-service/logs:/app/logs
    environment:
      NEO4J_DB_HOST: ${NEO4J_DB_HOST}
      NEO4J_DB_HTTP_PORT: ${NEO4J_DB_HTTP_PORT}
      NEO4J_DB_BOLT_PORT: ${NEO4J_DB_BOLT_PORT}
      NEO4J_DB_USERNAME: ${NEO4J_DB_USERNAME}
      NEO4J_DB_PASSWORD: ${NEO4J_DB_PASSWORD}
    depends_on:
      - neo4j
    networks:
      - sns-network
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.notification-service
    container_name: sns.notification-service
    expose:
      - "8082"
    volumes:
      - ./notification-service/logs:/app/logs
    networks:
      - sns-network
    restart: unless-stopped

  post-service:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.post-service
    container_name: sns.post-service
    expose:
      - "8083"
    volumes:
      - ./post-service/logs:/app/logs
    networks:
      - sns-network
    restart: unless-stopped

  file-service:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.file-service
    container_name: sns.file-service
    expose:
      - "8084"
    volumes:
      - ./file-service/logs:/app/logs
    networks:
      - sns-network
    restart: unless-stopped

  chat-service:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.chat-service
    container_name: sns.chat-service
    expose:
      - "8085"
    volumes:
      - ./chat-service/logs:/app/logs
    networks:
      - sns-network
    restart: unless-stopped

  search-service:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.search-service
    container_name: sns.search-service
    expose:
      - "8086"
    volumes:
      - ./search-service/logs:/app/logs
    networks:
      - sns-network
    restart: unless-stopped

  postgres:
    image: postgres:18.0-alpine
    container_name: sns.postgres
    hostname: postgres
    ports:
      - ${POSTGRES_DB_PORT}:${POSTGRES_DB_PORT}
    volumes:
      - ./data/postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_DB_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_NAME}
    networks:
      - sns-network
    restart: unless-stopped
  
  mongodb:
    image: mongo
    container_name: sns.mongodb
    hostname: mongodb
    ports:
      - ${MONGO_DB_PORT}:${MONGO_DB_PORT}
    volumes:
      - ./data/mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_DB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_DB_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
    networks:
      - sns-network
    restart: unless-stopped

  neo4j:
    image: neo4j
    container_name: sns.neo4j
    hostname: neo4j
    ports:
      - ${NEO4J_DB_HTTP_PORT}:${NEO4J_DB_HTTP_PORT}
      - ${NEO4J_DB_BOLT_PORT}:${NEO4J_DB_BOLT_PORT}
    volumes:
      - ./data/neo4j_data:/data
      - ./data/neo4j_logs:/logs
      - ./data/neo4j_plugins:/plugins
    environment:
      NEO4J_AUTH: ${NEO4J_DB_USERNAME}/${NEO4J_DB_PASSWORD}
    networks:
      - sns-network
    restart: unless-stopped
  
  kafka:
    image: 'apache/kafka'
    container_name: sns.kafka
    hostname: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
      - "9094:9094" 
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://localhost:9092,CONTROLLER://localhost:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    networks:
    - sns-network
    restart: unless-stopped

networks:
  sns-network:
    driver: bridge
    name: sns-network
